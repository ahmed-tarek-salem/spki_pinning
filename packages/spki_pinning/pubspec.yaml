name: spki_pinning
description: >-
  True SPKI (public-key) TLS pinning for Dart & Flutter. Survives certificate
  renewal, integrates with any HTTP client, fail-closed, with backup pins.
version: 0.1.0
repository: https://github.com/ahmed-tarek-salem/spki_pinning
environment:
  sdk: ">=3.4.0 <4.0.0"
false_secrets:
  - /test/fixtures/*.key.pem
dependencies:
  crypto: ^3.0.3
dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
