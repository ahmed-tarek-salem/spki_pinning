name: spki_pinning_http
description: >-
  package:http binding for spki_pinning — a routing Client with true SPKI
  (public-key) TLS pinning, fail-closed, with backup pins.
version: 0.1.0
repository: https://github.com/ahmed-tarek-salem/spki_pinning
environment:
  sdk: ">=3.4.0 <4.0.0"
false_secrets:
  - /test/fixtures/*.key.pem
dependencies:
  http: ^1.2.0
  spki_pinning: ^0.1.0
dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
